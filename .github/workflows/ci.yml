name: build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [shared, static, sanitize]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build libfftw3-dev libsndfile1-dev libncurses-dev clang-format
      - name: Configure
        shell: bash
        run: |
          if [ '${{ matrix.build }}' = sanitize ]; then
            meson setup build -Db_sanitize=address,undefined -Db_lundef=false -Dwerror=true
          else
            meson setup build -Ddefault_library=${{ matrix.build }} -Dwerror=true
          fi
      - run: meson compile -C build
      - run: meson compile -C build format-check
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install meson ninja fftw libsndfile pkgconf ncurses
      - run: meson setup build -Dwerror=true
      - run: meson compile -C build
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-clang
      - run: meson setup build -Dwerror=true
      - run: meson compile -C build
      - run: meson compile -C build format-check
